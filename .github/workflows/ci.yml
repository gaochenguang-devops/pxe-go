name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==================== 静态检查 + 单元测试 ====================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 从 go.mod 读取版本（go 1.25.0），自动缓存依赖与构建缓存
          go-version-file: go.mod
          cache: true

      - name: Go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Build all packages
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # -race 竞态检测依赖 cgo（仅本 step 开启；项目产物仍保持 CGO_ENABLED=0 纯 Go 静态编译）。
      # Linux runner 自带 gcc，无需额外安装。modernc sqlite 为纯 Go 实现，CGO 开启下同样正常工作。
      - name: Unit tests (with race detector)
        env:
          CGO_ENABLED: "1"
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  # ==================== 跨平台构建验证 ====================
  # 纯 Go SQLite（modernc），CGO_ENABLED=0 静态编译，无 glibc/交叉编译器依赖。
  # PXE 服务器目标平台为 Linux amd64 / arm64；Windows 产物供本地开发使用。
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross build (pure Go, no CGO)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o pxe-server-${{ matrix.name }} ./cmd/server

      - name: Smoke test (run -h for linux targets)
        if: matrix.goos == 'linux'
        run: ./pxe-server-${{ matrix.name }} -h 2>&1 | head -20 || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pxe-server-${{ matrix.name }}
          path: pxe-server-${{ matrix.name }}
          if-no-files-found: error
