name: Deploy

# 一键部署 PXE 服务到远程服务器（复用仓库自带 deploy/deploy.sh）
# 使用方式：
#   1. 在 GitHub 仓库 Settings → Secrets 配置：DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PORT
#   2. 部署用户需具备免密 sudo 权限（deploy.sh 内部使用 sudo systemctl 管理服务）
#   3. 在仓库 Actions 页面选择「Deploy」→ Run workflow 手动触发
# 如需 tag 推送自动部署，可在此文件 on 下追加:  push:  tags: ['v*']
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 部署环境（对应 GitHub Environments 保护规则，生产环境可配置人工审批）
        required: true
        default: production
        type: choice
        options:
          - production
      ref:
        description: 要部署的分支或 tag（默认 main）
        required: false
        default: main
        type: string
      arch:
        description: 目标服务器 CPU 架构
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
      mode:
        description: install = 首次安装, update = 热更新（保留数据仅替换程序）
        required: true
        default: update
        type: choice
        options:
          - update
          - install

jobs:
  deploy:
    name: Deploy pxe-server → ${{ inputs.environment }} (${{ inputs.arch }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install arm64 cross compiler
        if: inputs.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build linux binary
        env:
          GOOS: linux
          GOARCH: ${{ inputs.arch }}
          CGO_ENABLED: "1"
          CC: ${{ inputs.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          VERSION: ${{ github.sha }}
        # 产物命名与 deploy.sh BIN_NAME 一致（pxe-server-linux-<arch>）
        run: go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o pxe-server-linux-${{ inputs.arch }} ./cmd/server

      - name: Prepare deploy package
        run: |
          mkdir -p .deploy
          cp pxe-server-linux-${{ inputs.arch }} .deploy/
          cp -r deploy .deploy/
          cp -r assets .deploy/
          ls -lhR .deploy

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: ".deploy/*"
          target: "/tmp/pxe-deploy"
          strip_components: 1

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd /tmp/pxe-deploy
            sudo bash deploy.sh ${{ inputs.mode }}
            rm -rf /tmp/pxe-deploy
            systemctl --no-pager --lines=20 status pxe-server || true
