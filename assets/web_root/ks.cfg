# BC Linux for Euler 21.10 无人值守安装 KS 模板
# 占位符 192.168.200.1 由服务端自动替换；
# %pre / %post 动态内容由服务端注入。

graphical
reboot
keyboard --xlayouts='us'
lang en_US.UTF-8
timezone Asia/Shanghai --utc
firstboot --disable
services --enabled="chronyd"
firewall --disabled
selinux --disabled
rootpw --plaintext admin 

%include /tmp/arch-repo
%include /tmp/partinfo



%packages
@^minimal-environment
wget
bash-completion
lldpad
ipmitool
network-scripts
lrzsz
python3-IPy
tcpdump
telnet
vim
%end


%addon com_redhat_kdump --disable --reserve-mb='128'
%end
%addon org_bclinux_security_enhancement --disable
%end

%pre

# ===== 动态生成 %pre 脚本 =====
#!/bin/bash
set -x
exec >/tmp/ks-pre.log 2>&1
ARCH=$(uname -m)
if [ "${ARCH}" = "aarch64" ]; then
    REPO_ARCH=aarch64
else
    REPO_ARCH=x86_64
fi
cat > /tmp/arch-repo << REPO_EOF
url --url=http://192.168.200.10/repo/euler/${REPO_ARCH}/
REPO_EOF
disk=$(awk '$3 >= 461373440 && $3 <= 482344960 && $4 ~ /sd/ {print $4; exit}' /proc/partitions)
if [ -z "${disk}" ]; then
    echo "No system disk matched the configured size range" >&2
    exit 1
fi
cat > /tmp/partinfo << PART_EOF
bootloader --append=" crashkernel=auto" --location=mbr --boot-drive=${disk}
clearpart --all --initlabel --drives=${disk}
part pv.817 --fstype="lvmpv" --ondisk=${disk} --size=455836
part /boot --fstype="xfs" --ondisk=${disk} --size=500
part /boot/efi --fstype="efi" --ondisk=${disk} --size=500 --fsoptions="umask=0077,shortname=winnt"
volgroup bel --pesize=4096 pv.817
logvol swap --fstype="swap" --size=65536 --name=swap --vgname=bel
logvol / --fstype="xfs" --size=102400 --name=root --vgname=bel
logvol /home --fstype="xfs" --size=51200 --name=home --vgname=bel
logvol /var --fstype="xfs" --percent=100 --name=var --vgname=bel
PART_EOF
echo '===== %pre 完成 ====='
%end

%post

# ===== 动态生成 %post 脚本 =====
mkdir -p /root
curl -sS http://192.168.200.10/deploy.sh -o /root/deploy.sh
curl -sS http://192.168.200.10/node-info.txt -o /root/node-info.txt
curl -sS http://192.168.200.10/lldp.sh -o /root/lldp.sh
chmod +x /root/deploy.sh /root/lldp.sh
bash /root/deploy.sh
echo '===== %post 完成 ====='
%end